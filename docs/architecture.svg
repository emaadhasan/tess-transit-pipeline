<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #232F3E; }
      .sub   { font-size: 13px; fill: #3d4752; }
      .lbl   { font-size: 13px; font-weight: 600; fill: #232F3E; }
      .flow  { stroke: #232F3E; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash  { stroke: #8a929c; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>

  <!-- AWS Cloud boundary -->
  <rect x="300" y="130" width="950" height="610" rx="10" fill="#f7f8fa" stroke="#232F3E" stroke-width="1.5"/>
  <text x="318" y="156" class="title">AWS Cloud · us-east-2</text>

  <!-- External: NASA MAST -->
  <rect x="620" y="28" width="340" height="68" rx="8" fill="#eef4ff" stroke="#2d5bd1" stroke-width="1.5"/>
  <text x="790" y="57" class="title" text-anchor="middle">NASA MAST archive</text>
  <text x="790" y="79" class="sub" text-anchor="middle">TESS 2-minute light curves (public)</text>

  <!-- Laptop -->
  <rect x="30" y="300" width="230" height="220" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1.5"/>
  <text x="145" y="330" class="title" text-anchor="middle">Developer laptop</text>
  <text x="145" y="362" class="sub" text-anchor="middle">Docker build</text>
  <text x="145" y="386" class="sub" text-anchor="middle">AWS CLI</text>
  <text x="145" y="420" class="sub" text-anchor="middle">Jupyter notebooks:</text>
  <text x="145" y="442" class="sub" text-anchor="middle">validation, classifier,</text>
  <text x="145" y="464" class="sub" text-anchor="middle">candidate ranking</text>

  <!-- ECR -->
  <rect x="340" y="190" width="200" height="90" rx="8" fill="#fff4ea" stroke="#ED7100" stroke-width="2"/>
  <text x="440" y="225" class="title" text-anchor="middle">Amazon ECR</text>
  <text x="440" y="250" class="sub" text-anchor="middle">Docker image (versioned)</text>

  <!-- AWS Batch -->
  <rect x="600" y="170" width="380" height="260" rx="8" fill="#fff4ea" stroke="#ED7100" stroke-width="2"/>
  <text x="790" y="200" class="title" text-anchor="middle">AWS Batch</text>
  <text x="790" y="222" class="sub" text-anchor="middle">job queue → Fargate Spot compute environment</text>
  <rect x="625" y="240" width="330" height="150" rx="6" fill="#ffffff" stroke="#ED7100" stroke-dasharray="5 4"/>
  <g font-size="12" fill="#232F3E" text-anchor="middle">
    <rect x="645" y="262" width="62" height="46" rx="5" fill="#ffe2c7" stroke="#ED7100"/><text x="676" y="290">chunk 0</text>
    <rect x="722" y="262" width="62" height="46" rx="5" fill="#ffe2c7" stroke="#ED7100"/><text x="753" y="290">chunk 1</text>
    <rect x="799" y="262" width="62" height="46" rx="5" fill="#ffe2c7" stroke="#ED7100"/><text x="830" y="290">…</text>
    <rect x="876" y="262" width="62" height="46" rx="5" fill="#ffe2c7" stroke="#ED7100"/><text x="907" y="290">chunk 31</text>
  </g>
  <text x="790" y="338" class="sub" text-anchor="middle">32 parallel containers (array job)</text>
  <text x="790" y="360" class="sub" text-anchor="middle">each runs the pipeline on 34 stars</text>

  <!-- CloudWatch -->
  <rect x="1030" y="200" width="190" height="80" rx="8" fill="#fde8f3" stroke="#E7157B" stroke-width="2"/>
  <text x="1125" y="233" class="title" text-anchor="middle">CloudWatch Logs</text>
  <text x="1125" y="257" class="sub" text-anchor="middle">job output, 14-day retention</text>

  <!-- S3 -->
  <rect x="600" y="480" width="380" height="150" rx="8" fill="#f1f8e6" stroke="#7AA116" stroke-width="2"/>
  <text x="790" y="510" class="title" text-anchor="middle">Amazon S3 bucket</text>
  <g font-size="13" fill="#3d4752">
    <text x="630" y="545"><tspan font-weight="700" fill="#232F3E">targets/</tspan>   target lists in</text>
    <text x="630" y="572"><tspan font-weight="700" fill="#232F3E">results/</tspan>   per-chunk results and plots out</text>
    <text x="630" y="599"><tspan font-weight="700" fill="#232F3E">lake/</tspan>   partitioned Parquet (run=...)</text>
  </g>

  <!-- Athena -->
  <rect x="1030" y="520" width="190" height="90" rx="8" fill="#f2ebff" stroke="#8C4FFF" stroke-width="2"/>
  <text x="1125" y="552" class="title" text-anchor="middle">Amazon Athena</text>
  <text x="1125" y="576" class="sub" text-anchor="middle">SQL on the data lake</text>
  <text x="1125" y="596" class="sub" text-anchor="middle">(Glue Data Catalog table)</text>

  <!-- IAM -->
  <rect x="340" y="555" width="200" height="130" rx="8" fill="#fdecee" stroke="#DD344C" stroke-width="2"/>
  <text x="440" y="590" class="title" text-anchor="middle">IAM roles</text>
  <text x="440" y="614" class="sub" text-anchor="middle">execution role: pull image,</text>
  <text x="440" y="633" class="sub" text-anchor="middle">write logs</text>
  <text x="440" y="655" class="sub" text-anchor="middle">job role: one bucket only</text>
  <text x="440" y="676" font-size="12" font-style="italic" fill="#6b7480" text-anchor="middle">attached to every Batch job</text>

  <!-- Flows -->
  <polyline class="flow" points="260,330 285,330 285,235 338,235"/>
  <rect x="268" y="262" width="34" height="20" rx="10" fill="#232F3E"/><text x="285" y="277" font-size="12" fill="#fff" text-anchor="middle">1</text>

  <polyline class="flow" points="260,480 580,480 580,560 598,560"/>
  <rect x="400" y="470" width="34" height="20" rx="10" fill="#232F3E"/><text x="417" y="485" font-size="12" fill="#fff" text-anchor="middle">2</text>

  <line class="flow" x1="260" y1="400" x2="598" y2="400"/>
  <rect x="400" y="390" width="34" height="20" rx="10" fill="#232F3E"/><text x="417" y="405" font-size="12" fill="#fff" text-anchor="middle">3</text>

  <line class="flow" x1="540" y1="235" x2="598" y2="235"/>
  <rect x="552" y="207" width="34" height="20" rx="10" fill="#232F3E"/><text x="569" y="222" font-size="12" fill="#fff" text-anchor="middle">4</text>

  <line class="flow" x1="790" y1="96" x2="790" y2="168"/>
  <rect x="800" y="112" width="34" height="20" rx="10" fill="#232F3E"/><text x="817" y="127" font-size="12" fill="#fff" text-anchor="middle">5</text>

  <line class="flow" x1="790" y1="430" x2="790" y2="478"/>
  <rect x="800" y="444" width="34" height="20" rx="10" fill="#232F3E"/><text x="817" y="459" font-size="12" fill="#fff" text-anchor="middle">6</text>

  <line class="dash" x1="980" y1="240" x2="1028" y2="240"/>

  <line class="flow" x1="980" y1="565" x2="1028" y2="565"/>
  <rect x="987" y="535" width="34" height="20" rx="10" fill="#232F3E"/><text x="1004" y="550" font-size="12" fill="#fff" text-anchor="middle">7</text>

  <polyline class="flow" points="700,630 700,710 145,710 145,522"/>
  <rect x="400" y="700" width="34" height="20" rx="10" fill="#232F3E"/><text x="417" y="715" font-size="12" fill="#fff" text-anchor="middle">8</text>

</svg>
